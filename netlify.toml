# Netlify config for mahapatraplumbing.in (Astro static build).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Tracking IDs (PUBLIC_GTM_ID, PUBLIC_GA4_ID, PUBLIC_CLARITY_ID, PUBLIC_GADS_ID,
  # PUBLIC_META_PIXEL_ID, PUBLIC_MS_UET_ID) are set in the Netlify UI, not here.

# --- One canonical host: https://mahapatraplumbing.in (apex, HTTPS) ---
[[redirects]]
  from = "http://mahapatraplumbing.in/*"
  to = "https://mahapatraplumbing.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.mahapatraplumbing.in/*"
  to = "https://mahapatraplumbing.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.mahapatraplumbing.in/*"
  to = "https://mahapatraplumbing.in/:splat"
  status = 301
  force = true

# There are no /services/ or /areas/ hub pages: send trimmed URLs to the matching home section.
[[redirects]]
  from = "/services/"
  to = "/#what-plumbing-services-do-you-offer-in-bhubaneswar"
  status = 301

[[redirects]]
  from = "/areas/"
  to = "/#which-areas-of-bhubaneswar-do-you-serve"
  status = 301

# Pages without a trailing slash (e.g. /pricing) are 301-redirected to /pricing/ by Netlify's
# default "pretty URLs" handling, because every page is built as /path/index.html.
# Unknown URLs get dist/404.html (noindex) with a real 404 status automatically.

# --- Security headers (all responses) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Report-only for now: the browser logs violations to the console but blocks nothing. Test with the tracking
    # IDs switched on (GTM, GA4, Google Ads, Clarity, Meta Pixel, Microsoft UET) before making it enforcing.
    # 'unsafe-inline' is needed for the inline analytics loader, the Astro module loader and inlined CSS.
    # wa.me / api.whatsapp.com are plain link navigations and window.open, which CSP does not restrict.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://*.clarity.ms https://connect.facebook.net https://bat.bing.com; style-src 'self' 'unsafe-inline' https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://*.g.doubleclick.net https://googleads.g.doubleclick.net https://www.google.com https://www.google.co.in https://www.googleadservices.com https://*.clarity.ms https://c.bing.com https://bat.bing.com https://www.facebook.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://www.google.com https://www.googleadservices.com https://*.clarity.ms https://c.bing.com https://bat.bing.com https://www.facebook.com https://connect.facebook.net; frame-src https://www.google.com https://maps.google.com https://www.googletagmanager.com https://td.doubleclick.net https://www.facebook.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; frame-ancestors 'self'"

# --- Caching ---
# Hashed build assets (logo AVIF/WebP, any future bundles): cache for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fixed-name images and icons: one week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Fixed-name PNG icons, listed one by one: a "/*.png" pattern may be read by Netlify as "/*",
# which would give every HTML page a one-week cache.
[[headers]]
  for = "/favicon-32.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

# HTML, sitemap.xml and robots.txt get no Cache-Control rule here: Netlify's default (max-age=0, must-revalidate)
# applies, so updates show at once. Never add a header rule that could match HTML (e.g. "/*" or "/*.ext").
